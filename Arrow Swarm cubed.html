<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arrow Swarm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a stage holding one wireframe cube. The swarm walks over its six faces and around its edges; once the fury meter fills, the arrows lift off and fill the whole screen. */
  :root {
    --bg: #e8edf1;
    --stage: #f4f7f9;
    --face: #cbd7e0;
    --line: #b7c4cf;
    --ink: #14232f;
    --muted: #4f626f;
    --arrow: #1f4766;
    --rage: #cf1b1b;
    --accent: #d8432a;
    --panel: #dde5eb;
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c151d; --stage: #101c26; --face: #1c2d3c; --line: #27394a; --ink: #e4edf3;
      --muted: #8ea3b3; --arrow: #8dc0e6; --rage: #ff3d3d; --accent: #ff7b57; --panel: #15222d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c151d; --stage: #101c26; --face: #1c2d3c; --line: #27394a; --ink: #e4edf3;
    --muted: #8ea3b3; --arrow: #8dc0e6; --rage: #ff3d3d; --accent: #ff7b57; --panel: #15222d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap { width: min(100%, 720px); margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
  .title { min-width: 0; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .hint { margin: 0; color: var(--muted); }
  .hint b { color: var(--accent); font-weight: 500; }

  .fury { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; min-width: 0; }
  .fury-label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); }
  .segs { display: flex; gap: 3px; }
  .seg { width: 12px; height: 9px; border: 1px solid var(--line); border-radius: 1px; background: transparent; transition: background-color .2s, border-color .2s; }
  .seg.on { background: var(--rage); border-color: var(--rage); }
  .fury-text { font-variant-numeric: tabular-nums; min-width: 9ch; }

  .stage {
    position: relative;
    height: clamp(320px, 58vh, 580px);
    min-width: 0;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: grab;
    touch-action: none;
  }
  .stage.dragging { cursor: grabbing; }
  .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Full-screen layer above the page so the swarm can fly over everything once it is out. Clicks pass through. */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 5; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px 18px;
    align-items: end;
  }
  .ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ctl .row { display: flex; justify-content: space-between; gap: 8px; }
  .ctl label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); }
  .ctl output { font-variant-numeric: tabular-nums; font-weight: 500; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  input[type="range"]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button {
    font: inherit;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 3px;
    padding: 7px 10px;
    cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--bg); }
</style>

<canvas id="cv" role="img" aria-label="A swarm of small V-shaped arrows flocking over the faces of a rotating cube and chasing the cursor"></canvas>

<div class="wrap">
  <header>
    <div class="title">
      <h1>Arrow Swarm</h1>
      <p class="hint">Drag to turn the cube. Hover to call them in. <b>Click</b> to scare them. Do it enough and they leave the cube.</p>
    </div>
    <div class="fury" role="status">
      <span class="fury-label">Fury</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="fury-text" id="fury-text"></span>
      <button type="button" id="fury-btn">Calm them down</button>
    </div>
  </header>

  <div class="stage" id="stage" tabindex="0" aria-label="Cube. Drag or use the arrow keys to turn it."></div>

  <section class="panel" id="panel" aria-label="Swarm rules"></section>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var panel = document.getElementById('panel');
  var segsEl = document.getElementById('segs');
  var furyText = document.getElementById('fury-text');
  var furyBtn = document.getElementById('fury-btn');

  var vw = 800, vh = 600, dpr = 1;
  var H = 120;              /* cube half-edge, in model units */
  var D = 5 * H;            /* camera distance */
  var cx = 400, cy = 300, f = 500;   /* screen centre of the cube and focal length in px */
  var box = { x0: 0, y0: 0, x1: 720, y1: 400 };
  var colors = { arrow: '#1f4766', rage: '#cf1b1b', accent: '#d8432a', ink: '#14232f', face: '#cbd7e0' };
  var rgb = { arrow: [31, 71, 102], rage: [207, 27, 27] };

  /* The four rules, the cursor, the spin, and how many clicks it takes to break out. */
  var P = { separation: 1.5, alignment: 1.0, cohesion: 1.0, border: 2.0, mouse: 0.7, spin: 0.4, size: 9, count: 180, escapeAt: 8 };
  var DEFAULTS = JSON.parse(JSON.stringify(P));
  var controls = [
    { key: 'separation', label: "Don't collide", min: 0, max: 3, step: 0.1 },
    { key: 'alignment',  label: 'Match direction', min: 0, max: 3, step: 0.1 },
    { key: 'cohesion',   label: "Don't stray", min: 0, max: 3, step: 0.1 },
    { key: 'border',     label: 'Avoid screen edge', min: 0, max: 4, step: 0.1 },
    { key: 'mouse',      label: 'Follow cursor', min: 0, max: 2, step: 0.05 },
    { key: 'spin',       label: 'Cube spin', min: 0, max: 2, step: 0.1 },
    { key: 'size',       label: 'Arrow size', min: 4, max: 24, step: 1, int: true },
    { key: 'count',      label: 'Arrows', min: 20, max: 400, step: 10, int: true },
    { key: 'escapeAt',   label: 'Clicks to escape', min: 3, max: 15, step: 1, int: true }
  ];

  /* ---------- 3x3 matrix helpers (row-major, model to view) ---------- */
  function mmul(A, B) {
    var C = new Array(9);
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++)
      C[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
    return C;
  }
  function transpose(M) { return [M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8]]; }
  function rotY(t) { var c = Math.cos(t), s = Math.sin(t); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
  function rotX(t) { var c = Math.cos(t), s = Math.sin(t); return [1, 0, 0, 0, c, -s, 0, s, c]; }
  function ortho(M) {
    var a0 = M[0], a1 = M[1], a2 = M[2], l = Math.sqrt(a0 * a0 + a1 * a1 + a2 * a2) || 1;
    a0 /= l; a1 /= l; a2 /= l;
    var b0 = M[3], b1 = M[4], b2 = M[5], d = b0 * a0 + b1 * a1 + b2 * a2;
    b0 -= d * a0; b1 -= d * a1; b2 -= d * a2;
    l = Math.sqrt(b0 * b0 + b1 * b1 + b2 * b2) || 1; b0 /= l; b1 /= l; b2 /= l;
    return [a0, a1, a2, b0, b1, b2, a1 * b2 - a2 * b1, a2 * b0 - a0 * b2, a0 * b1 - a1 * b0];
  }

  var RM = mmul(rotX(-0.5), rotY(-0.6));
  var omega = { x: 0, y: 0 };   /* angular velocity left over from a drag, rad per frame */

  function toModel(x, y, z) {   /* view vector to model vector */
    return [RM[0] * x + RM[3] * y + RM[6] * z, RM[1] * x + RM[4] * y + RM[7] * z, RM[2] * x + RM[5] * y + RM[8] * z];
  }

  var boids = [];
  var shocks = [];
  var mouse = { x: 0, y: 0, seen: false, active: false };
  var gest = null;
  var scaredAt = -1e9;
  var clicks = 0;
  var escaped = false;
  var anger = 0;
  var breakoutUntil = 0;

  /* ---------- colour ---------- */
  function parseColor(str, fallback) {
    try {
      ctx.fillStyle = '#000000';
      ctx.fillStyle = str;
      var v = ctx.fillStyle;
      if (v.charAt(0) === '#' && v.length === 7) {
        return [parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16)];
      }
      var m = v.match(/[\d.]+/g);
      if (m && m.length >= 3) return [+m[0], +m[1], +m[2]];
    } catch (e) {}
    return fallback;
  }
  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    colors.arrow = cs.getPropertyValue('--arrow').trim() || colors.arrow;
    colors.rage = cs.getPropertyValue('--rage').trim() || colors.rage;
    colors.accent = cs.getPropertyValue('--accent').trim() || colors.accent;
    colors.ink = cs.getPropertyValue('--ink').trim() || colors.ink;
    colors.face = cs.getPropertyValue('--face').trim() || colors.face;
    rgb.arrow = parseColor(colors.arrow, rgb.arrow);
    rgb.rage = parseColor(colors.rage, rgb.rage);
  }

  /* ---------- layout ---------- */
  function measure() {
    var r = stage.getBoundingClientRect();
    box.x0 = r.left; box.y0 = r.top; box.x1 = r.right; box.y1 = r.bottom;
    cx = (r.left + r.right) / 2; cy = (r.top + r.bottom) / 2;
    f = 1.08 * Math.min(r.width, r.height);
  }
  function resize() {
    var de = document.documentElement;
    vw = Math.max(100, de.clientWidth); vh = Math.max(100, de.clientHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    measure();
  }

  /* ---------- geometry ---------- */
  function clampH(x) { return x < -H ? -H : (x > H ? H : x); }

  /* Closest point on the cube surface, and which face it belongs to. */
  function nearSurf(p) {
    var q = [clampH(p[0]), clampH(p[1]), clampH(p[2])];
    var inside = Math.abs(p[0]) < H && Math.abs(p[1]) < H && Math.abs(p[2]) < H;
    var ax = 0, m = -1, i;
    for (i = 0; i < 3; i++) if (Math.abs(p[i]) > m) { m = Math.abs(p[i]); ax = i; }
    if (inside) q[ax] = (p[ax] >= 0 ? 1 : -1) * H;
    return { q: q, fa: ax, fs: q[ax] >= 0 ? 1 : -1 };
  }

  /* Cast a ray from the camera through a screen point; return where it first meets the cube. */
  function rayCube(mx, my) {
    var dx = (mx - cx) / f, dy = (my - cy) / f;
    var o = toModel(0, 0, D), d = toModel(dx, dy, -1);
    var tn = -1e9, tf = 1e9, ax = -1, sg = 0, i;
    for (i = 0; i < 3; i++) {
      if (Math.abs(d[i]) < 1e-9) { if (Math.abs(o[i]) > H) return null; continue; }
      var t1 = (-H - o[i]) / d[i], t2 = (H - o[i]) / d[i], s = -1;
      if (t1 > t2) { var tmp = t1; t1 = t2; t2 = tmp; s = 1; }
      if (t1 > tn) { tn = t1; ax = i; sg = s; }
      if (t2 < tf) tf = t2;
    }
    if (ax < 0 || tn > tf || tf < 0) return null;
    var p = [clampH(o[0] + d[0] * tn), clampH(o[1] + d[1] * tn), clampH(o[2] + d[2] * tn)];
    p[ax] = sg * H;
    return { p: p, fa: ax, fs: sg };
  }

  /* ---------- boids ---------- */
  function newBoid(mode) {
    var fa = Math.floor(Math.random() * 3), fs = Math.random() < 0.5 ? -1 : 1;
    var p = [0, 0, 0], v = [0, 0, 0];
    for (var i = 0; i < 3; i++) p[i] = (Math.random() * 2 - 1) * H * 0.92;
    p[fa] = fs * H;
    var a = Math.random() * 6.283, s = 1.6 + Math.random() * 1.2;
    var t1 = (fa + 1) % 3, t2 = (fa + 2) % 3;
    v[t1] = Math.cos(a) * s; v[t2] = Math.sin(a) * s;
    var b = { p: p, v: v, a: [0, 0, 0], fa: fa, fs: fs, mode: 0, scare: 0 };
    if (mode === 1) { b.mode = 1; b.v[fa] = fs * 2; }
    return b;
  }
  function setCount(n) {
    while (boids.length < n) boids.push(newBoid(escaped ? 1 : 0));
    if (boids.length > n) boids.length = n;
  }

  /* Turn the cube. Free-flying arrows stay put in the room instead of spinning with it. */
  function applyRot(dR) {
    var old = RM;
    RM = ortho(mmul(dR, RM));
    var M = null, i;
    for (i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.mode === 0) continue;
      if (!M) M = mmul(transpose(RM), old);
      var p = b.p, v = b.v;
      b.p = [M[0] * p[0] + M[1] * p[1] + M[2] * p[2], M[3] * p[0] + M[4] * p[1] + M[5] * p[2], M[6] * p[0] + M[7] * p[1] + M[8] * p[2]];
      b.v = [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
    }
  }

  /* Walk a boid over the surface; when it crosses an edge it folds onto the next face. */
  function moveOnSurface(b, dt) {
    var p = b.p, v = b.v, pass, ax;
    p[0] += v[0] * dt; p[1] += v[1] * dt; p[2] += v[2] * dt;
    for (pass = 0; pass < 3; pass++) {
      var folded = false;
      for (ax = 0; ax < 3; ax++) {
        if (ax === b.fa) continue;
        var over = Math.abs(p[ax]) - H;
        if (over > 0) {
          var t = p[ax] > 0 ? 1 : -1;
          var vout = Math.max(v[ax] * t, 0.5);
          p[ax] = t * H;
          p[b.fa] = b.fs * Math.max(H - over, -H);
          v[b.fa] = -b.fs * vout;
          v[ax] = 0;
          b.fa = ax; b.fs = t;
          folded = true;
          break;
        }
      }
      if (!folded) break;
    }
    p[b.fa] = b.fs * H;
    v[b.fa] = 0;
  }

  function limitSpeed(b, dt, extra) {
    var v = b.v;
    var sp = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 0.0001;
    var maxS = 3.2 + b.scare * 3.5 + extra, minS = 1.4;
    if (sp > maxS) { var f1 = 1 - (1 - maxS / sp) * Math.min(1, 0.25 * dt); v[0] *= f1; v[1] *= f1; v[2] *= f1; }
    else if (sp < minS) { var f2 = minS / sp; v[0] *= f2; v[1] *= f2; v[2] *= f2; }
  }

  /* ---------- click: scare ---------- */
  function scare(sx, sy, hit, now) {
    scaredAt = now;
    var rad3 = 170, radPx = rad3 * f / D;
    shocks.push({ x: sx, y: sy, age: 0, radius: radPx });
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i], p = b.p, fr, dir;
      if (b.mode === 0) {
        if (!hit) continue;
        var dx = p[0] - hit.p[0], dy = p[1] - hit.p[1], dz = p[2] - hit.p[2];
        var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d > rad3) continue;
        dir = [dx, dy, dz]; dir[b.fa] = 0;
        var tl = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1] + dir[2] * dir[2]);
        if (tl < 0.5) {
          var a = Math.random() * 6.283;
          dir = [0, 0, 0]; dir[(b.fa + 1) % 3] = Math.cos(a); dir[(b.fa + 2) % 3] = Math.sin(a); tl = 1;
        }
        fr = 1 - d / rad3;
        b.v[0] += dir[0] / tl * fr * 8; b.v[1] += dir[1] / tl * fr * 8; b.v[2] += dir[2] / tl * fr * 8;
        b.scare = Math.max(b.scare, Math.sqrt(fr));
      } else {
        var Xv = RM[0] * p[0] + RM[1] * p[1] + RM[2] * p[2];
        var Yv = RM[3] * p[0] + RM[4] * p[1] + RM[5] * p[2];
        var Zv = RM[6] * p[0] + RM[7] * p[1] + RM[8] * p[2];
        var s = f / (D - Zv);
        var ddx = cx + Xv * s - sx, ddy = cy + Yv * s - sy, dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd > radPx) continue;
        if (dd < 0.5) { var a2 = Math.random() * 6.283; ddx = Math.cos(a2); ddy = Math.sin(a2); dd = 1; }
        fr = 1 - dd / radPx;
        var m = toModel(ddx / dd, ddy / dd, 0);
        b.v[0] += m[0] * fr * 8; b.v[1] += m[1] * fr * 8; b.v[2] += m[2] * fr * 8;
        b.scare = Math.max(b.scare, Math.sqrt(fr));
      }
    }
  }

  /* ---------- fury meter ---------- */
  function buildSegs() {
    segsEl.innerHTML = '';
    for (var i = 0; i < P.escapeAt; i++) {
      var s = document.createElement('span'); s.className = 'seg'; segsEl.appendChild(s);
    }
    updateHud();
  }
  function updateHud() {
    var segs = segsEl.children;
    for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('on', escaped || i < clicks);
    furyText.textContent = escaped ? 'They got out.' : clicks + ' / ' + P.escapeAt + ' clicks';
    furyBtn.textContent = escaped ? 'Lock them back in' : 'Calm them down';
  }

  /* The arrows lift off the cube along their face normal and spread over the screen. */
  function doEscape(now) {
    escaped = true;
    breakoutUntil = now + 2200;
    scaredAt = now;
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.mode === 0) {
        var sp = 2.5 + Math.random() * 2;
        b.v[b.fa] = b.fs * sp;
      }
      b.mode = 1;
    }
    updateHud();
  }
  /* They fly back and settle on the nearest face. */
  function lockBack() {
    clicks = 0; escaped = false; breakoutUntil = 0;
    for (var i = 0; i < boids.length; i++) if (boids[i].mode === 1) boids[i].mode = 2;
    updateHud();
  }

  /* ---------- simulation ---------- */
  function step(dt, now) {
    measure();
    if (!escaped && clicks >= P.escapeAt) doEscape(now);

    /* Cube rotation: leftover drag inertia plus the slow idle spin */
    if (!(gest && gest.moved)) {
      var wy = omega.y + 0.004 * P.spin, wx = omega.x;
      if (wx || wy) applyRot(mmul(rotX(wx * dt), rotY(wy * dt)));
      var dec = Math.pow(0.94, dt); omega.x *= dec; omega.y *= dec;
      if (Math.abs(omega.x) < 1e-5) omega.x = 0;
      if (Math.abs(omega.y) < 1e-5) omega.y = 0;
    }

    var n = boids.length, i, j;
    var NR = Math.max(70, P.size * 8), NR2 = NR * NR;
    var S = P.size * 3.2, S2 = S * S;

    var hit = mouse.seen ? rayCube(mouse.x, mouse.y) : null;
    mouse.active = !!hit || (escaped && mouse.seen);
    var mouseGain = Math.min(1, Math.max(0, (now - scaredAt - 700) / 1500));
    var breakGain = now < breakoutUntil ? Math.min(1, (breakoutUntil - now) / 800) : 0;
    var wander = 0.04 + anger * 0.05;
    var cdx = (mouse.x - cx) / f, cdy = (mouse.y - cy) / f;

    for (i = 0; i < n; i++) {
      var b = boids[i], p = b.p, v = b.v;
      var sx = 0, sy = 0, sz = 0, avx = 0, avy = 0, avz = 0, ccx = 0, ccy = 0, ccz = 0, cnt = 0;
      var nd2 = 1e18, ni = -1;
