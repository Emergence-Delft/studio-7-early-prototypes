  function sha256(s) {
    var K = [], H0 = [], p = 2, n = 0;
    function f(x) { return ((x - Math.floor(x)) * 4294967296) | 0; }
    while (n < 64) { for (var d = 2; d * d <= p; d++) if (p % d === 0) break; if (d * d > p) { if (n < 8) H0[n] = f(Math.pow(p, 1 / 2)); K[n++] = f(Math.pow(p, 1 / 3)); } p++; }

        }

<body>
<h1>Light-tree lamp prototype</h1>
<p class="sub">Drag a tape ring (or a knob on the left rail) to slide the units in and out. All pipes move together. Drag empty space to rotate the view.</p>
<div class="stage"><canvas id="c"></canvas></div>
<div class="ctl">
  <div class="btns"><button id="bph" class="on">Photonic state</button><button id="bel">Electronic state</button></div>
  <label>Fold (pipe → flowers)<input id="fold" type="range" min="0" max="100" value="55"></label>
  <label>Strips per unit: <span id="nv">8</span><input id="n" type="range" min="4" max="14" step="2" value="8"></label>
  <div class="btns">
    <button id="bp">Pipe</button><button id="bf">Flowers</button><button id="ba">Wave</button><button id="bl" class="on">LED</button><button id="bb" class="on">Breathe</button><button id="br">Reset view</button>
  </div>
</div>
<script>
const L=200,R0=30,DMIN=0.85*L,NG=6,W=1800,CW=10,SEG=12,ROD0=30,ROD1=1700,RODR=R0-3.5,BREATH=14;
let N=8,yaw=0.45,pitch=0.14,anim=false,tA=0,led=true,tL=0,state='photonic',saved=null,ev=[],breathe=true,fp=1,fe=0,tfp=1,tfe=0,pend=null,tr=null;
const gapFor=f=>L-f*(L-DMIN);
const mkP=d=>Array.from({length:NG+1},(_,i)=>ROD0+30+i*d);
let p=mkP(gapFor(0.55));

/* buckled strip: clamped ends, arc length fixed = L */
function amp(d){
  if(d>=L-0.05)return 0;
  const len=A=>{let s=0,n=24;for(let i=0;i<n;i++){const t=(i+.5)/n,sl=A*Math.PI/d*Math.sin(2*Math.PI*t);s+=Math.sqrt(1+sl*sl)*d/n}return s};
  let lo=0,hi=L;
  for(let i=0;i<22;i++){const m=(lo+hi)/2;len(m)<L?lo=m:hi=m}
  return (lo+hi)/2;
}
const SP=2*(R0+amp(gapFor(0.45)));
const touching=d=>amp(d)>=SP/2-R0-0.3;

/* tree lamp as a PHYSICAL structure: rigid pole + 3 rigid branches (fixed); the flowers are sleeves on top.
   Where a flower would hit a pole/branch, the few strips in the way are left out (computed for every possible state). */
const BST=45,BTH=50*Math.PI/180,LENP=NG*L+80;
const BLEN=BST+2*L+40,TH=1500,OY=-TH/2,LEN=LENP;
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vnorm=a=>{const m=Math.hypot(a[0],a[1],a[2]);return [a[0]/m,a[1]/m,a[2]/m]};
const polePt=a=>[0,OY+(a-ROD0),0];
const DN=gapFor(0.55),JA=[1,3,5].map(i=>ROD0+LENP/2-NG*DN/2+i*DN);   /* joints sit at the pole where a collar is in the default pose */
const ENDS=[{B:polePt(ROD0),T:polePt(ROD0+LENP)}];
const SPEC=[{groups:[{c:ROD0+LENP/2,n:NG,gi0:0,anchor:'c'}],len:LENP,rho0:0,rs:1,main:true,rr:RODR}];
[-1,1,-1].forEach((sx,bi)=>{
  const J=polePt(JA[bi]),eb=[sx*Math.sin(BTH),Math.cos(BTH),0];
  ENDS.push({B:J,T:[J[0]+eb[0]*BLEN,J[1]+eb[1]*BLEN,0]});
  SPEC.push({groups:[{a0:ROD0+BST,n:2,gi0:(bi*2+1)%NG,anchor:'s'}],len:BLEN,rho0:(JA[bi]-ROD0)/LENP,rs:BLEN/LENP,main:false,rr:14});
});
const PIPES=ENDS.map((E,i)=>{
  const e1=vnorm(vsub(E.T,E.B)),e2=vnorm(vcross(e1,[0,0,1])),e3=vcross(e1,e2),k=W/2-ROD0;
  return Object.assign({c:[E.B[0]+e1[0]*k,E.B[1]+e1[1]*k,E.B[2]+e1[2]*k],e1,e2,e3,idx:i,l:i,ct:[],phi:new Array(NG).fill(0),del:[]},SPEC[i]);
});
const OFFS=PIPES,CONTACTS=[];
const kOf=()=>0,cTouch=()=>false;
/* light runs up the pole and is passed on into each branch at its joint */
const ringRho=(F,u)=>F.rho0+u*F.rs;
function layoutOf(F,pp){
  const U=[],R=[];
  F.groups.forEach((G,gk)=>{
    let tot=0;for(let u=0;u<G.n;u++){const gi=(G.gi0+u)%NG;tot+=pp[gi+1]-pp[gi]}
    let a=G.anchor==='s'?G.a0:G.c-tot/2;
    for(let u=0;u<G.n;u++){const gi=(G.gi0+u)%NG,d=pp[gi+1]-pp[gi];R.push({a,j:u-G.n/2,id:F.idx+':'+gk+':'+u});U.push({a,d});a+=d}
    R.push({a,j:G.n/2,id:F.idx+':'+gk+':'+G.n});
  });
  return {U,R};
}
/* which strips must be left out: test every strip against the rods and against the other flowers, over many random poses */
function computeMasks(){
  const hw=Math.min(R0*Math.PI/N*0.8,26),MG=3,T=8;
  PIPES.forEach(F=>{F.del=[];F.groups.forEach(G=>{for(let u=0;u<G.n;u++)F.del.push(new Set())})});
  let seed=12345;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const states=[Array(NG).fill(L),Array(NG).fill(DMIN)];
  for(let i=0;i<40;i++)states.push(Array.from({length:NG},()=>DMIN+rnd()*(L-DMIN)));
  const pts=(F,a0,d,k)=>{
    const A=amp(d),th=2*Math.PI*k/N,out=[];
    for(let i=0;i<=T;i++){const t=i/T,rr=R0+A*(1-Math.cos(2*Math.PI*t))/2;out.push(world(a0+t*d,rr*Math.cos(th),rr*Math.sin(th),F))}
    return out;
  };
  const segD=(P,A,B)=>{const d=vsub(B,A),w=vsub(P,A);let t=(w[0]*d[0]+w[1]*d[1]+w[2]*d[2])/(d[0]*d[0]+d[1]*d[1]+d[2]*d[2]);t=Math.max(0,Math.min(1,t));return Math.hypot(w[0]-d[0]*t,w[1]-d[1]*t,w[2]-d[2]*t)};
  const pole=PIPES[0];
  for(const gaps of states){
    const pp=[0];for(let i=0;i<NG;i++)pp.push(pp[i]+gaps[i]);
    const LP=layoutOf(pole,pp).U,PS=LP.map(u=>Array.from({length:N},(_,k)=>pts(pole,u.a,u.d,k)));
    for(let b=1;b<PIPES.length;b++){
      const BF=PIPES[b],LB=layoutOf(BF,pp).U,BS=LB.map(u=>Array.from({length:N},(_,k)=>pts(BF,u.a,u.d,k)));
      const R0p=world(ROD0,0,0,BF),R1p=world(ROD0+BF.len,0,0,BF);
      for(let u=0;u<PS.length;u++)for(let k=0;k<N;k++){          /* pole strips against the branch rod */
        if(PS[u][k].some(P=>segD(P,R0p,R1p)<BF.rr+hw+MG))pole.del[u].add(k);
      }
      for(let u=0;u<BS.length;u++)for(let k=0;k<N;k++){          /* branch strips against the pole rod and the pole flowers */
        const sp=BS[u][k];let bad=sp.some(P=>Math.hypot(P[0],P[2])<pole.rr+hw+MG);
        for(let pu=0;pu<PS.length&&!bad;pu++)for(let pk=0;pk<N&&!bad;pk++){
          const q=PS[pu][pk];
          for(let i=0;i<sp.length&&!bad;i++)for(let j=0;j<q.length;j++){
            if(Math.hypot(sp[i][0]-q[j][0],sp[i][1]-q[j][1],sp[i][2]-q[j][2])<2*hw+MG){bad=true;break}
          }
        }
        if(bad)BF.del[u].add(k);
      }
    }
  }
}
computeMasks();

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const foldEl=document.getElementById('fold');
let S=1,cssW=0,cssH=0,hover=-1,active=-1,hitDir=[0,1],curF=null;
function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  cssW=r.width;cssH=Math.round(Math.max(620,Math.min(1000,cssW*1.15)));
  const dpr=window.devicePixelRatio||1;
  cv.width=cssW*dpr;cv.height=cssH*dpr;cv.style.height=cssH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(cssW/1000,cssH/(TH+260));
}
addEventListener('resize',resize);resize();

let _cy=1,_sy=0,_cp=1,_sp=0;
function setTrig(){_cy=Math.cos(yaw);_sy=Math.sin(yaw);_cp=Math.cos(pitch);_sp=Math.sin(pitch)}
function rot(x,y,z){const x1=x*_cy+z*_sy,z1=-x*_sy+z*_cy;return [x1,y*_cp-z1*_sp,y*_sp+z1*_cp]}
function wp(X,Y,Z){const r=rot(X,Y,Z),f=1/(1-r[2]/3000);return [cssW/2+r[0]*S*f,cssH*0.52-r[1]*S*f,r[2]]}
function world(a,u,v,F){const s=a-W/2;return [F.c[0]+F.e1[0]*s+F.e2[0]*u+F.e3[0]*v,F.c[1]+F.e1[1]*s+F.e2[1]*u+F.e3[1]*v,F.c[2]+F.e1[2]*s+F.e2[2]*u+F.e3[2]*v]}
function proj(a,u,v,F){
  const s=a-W/2;
  return wp(F.c[0]+F.e1[0]*s+F.e2[0]*u+F.e3[0]*v,F.c[1]+F.e1[1]*s+F.e2[1]*u+F.e3[1]*v,F.c[2]+F.e1[2]*s+F.e2[2]*u+F.e3[2]*v);
}
function axisDir(F,a){const A=proj(a,0,0,F),B=proj(a+20,0,0,F);return [(B[0]-A[0])/20,(B[1]-A[1])/20]}

function setCollar(i,x){
  const q=p.slice();q[i]=x;
  const cl=v=>Math.min(L,Math.max(DMIN,v));
  for(let j=i+1;j<=NG;j++)q[j]=q[j-1]+cl(q[j]-q[j-1]);
  for(let j=i-1;j>=0;j--)q[j]=q[j+1]-cl(q[j+1]-q[j]);
  if(Math.abs(q[0]-(ROD0+30))>0.01||q[NG]>ROD1-10)return;
  p=q;
}
function setEqual(d){p=mkP(d)}
/* displayed positions: gentle breathing wave on top of the set positions */
function disp(){
  if(state!=='photonic'||!breathe||tr||pend||fp<0.001)return p;
  const q=[p[0]];
  for(let i=0;i<NG;i++)q.push(q[i]+Math.min(L,Math.max(DMIN,p[i+1]-p[i]+BREATH*fp*Math.sin(tL*1.4-i*0.9))));
  return q;
}

function rodFill(v,x,F){
  let r=150*v,g=158*v,b=176*v;
  if(fe>0.001){
    const u=(x-ROD0)/F.len,I=Math.pow(Math.max(0,Math.cos(6.2832*(ringRho(F,u)-tL*0.12))),6)*fe,y=0.75+0.25*v;
    r+=(255*y-r)*I;g+=(214*y-g)*I;b+=(60*y-b)*I;
  }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
function hsl2rgb(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return [255*f(0),255*f(8),255*f(4)]}

const RAILX=26,railY=a=>cssH*0.14+(a-ROD0)/(ROD1-ROD0)*cssH*0.72;

function render(){setTrig();const pb=p;p=disp();try{renderCore()}finally{p=pb}}
function renderCore(){
  const css=getComputedStyle(document.documentElement);
  const mute=css.getPropertyValue('--mute').trim(),acc=css.getPropertyValue('--acc').trim(),rail=css.getPropertyValue('--rail').trim();
  ctx.clearRect(0,0,cssW,cssH);
  const quads=[],light=[0.3,0.6,0.7];
  const shade=(nx,ny,nz)=>{
    const F=curF||PIPES[0];
    const r=rot(F.e2[0]*nx-F.e1[0]*ny+F.e3[0]*nz,F.e2[1]*nx-F.e1[1]*ny+F.e3[1]*nz,F.e2[2]*nx-F.e1[2]*ny+F.e3[2]*nz),m=Math.hypot(r[0],r[1],r[2])||1;
    return Math.abs((r[0]*light[0]+r[1]*light[1]+r[2]*light[2])/m);
  };
  const hw=Math.min(R0*Math.PI/N*0.8,26);
  const LC=[];for(let k=0;k<N;k++)LC.push(hsl2rgb(360*k/N,0.9,0.55));
  const AN=16,RN=8,RS=36;
  for(const F of PIPES){
    curF=F;
    const {U,R}=layoutOf(F,p);
    for(let g=0;g<U.length;g++){
      const d=U[g].d,A=amp(d),a0=U[g].a;
      for(let k=0;k<N;k++){
        if(F.del[g].has(k))continue;
        const th=2*Math.PI*k/N,c=Math.cos(th),s=Math.sin(th);
        const pt=(t,side)=>{const rr=R0+A*(1-Math.cos(2*Math.PI*t))/2;return proj(a0+t*d,rr*c-side*hw*s,rr*s+side*hw*c,F)};
        for(let i=0;i<SEG;i++){
          const t0=i/SEG,t1=(i+1)/SEG,tm=(t0+t1)/2;
          const slope=A*Math.PI/d*Math.sin(2*Math.PI*tm);
          const sh=shade(c,slope,s),v=Math.round(196+58*sh);
          const a=pt(t0,-1),b=pt(t0,1),e=pt(t1,1),f=pt(t1,-1);
          let fill=`rgb(${v},${v},${Math.min(255,v+4)})`,stroke='rgba(60,70,95,.28)';
          const rho=ringRho(F,(a0+tm*d-ROD0)/F.len);
          if(fe>0.001){
            const I=Math.pow(Math.max(0,Math.cos(6.2832*(rho-tL*0.12))),6),m=I*0.55*fe;
            fill=`rgb(${Math.round(v+(255-v)*m)},${Math.round(v+(214-v)*m)},${Math.round(v+(70-v)*m)})`;
          }else if(led&&fp>0.001){
            const I=Math.pow(Math.max(0,Math.cos(6.2832*(rho-tL*0.12-k*0.09))),3),lc=LC[k%N],m=I*0.92*fp;
            fill=`rgb(${Math.round(v+(lc[0]-v)*m)},${Math.round(v+(lc[1]-v)*m)},${Math.round(v+(lc[2]-v)*m)})`;
            if(I*fp>0.3)stroke=`rgba(${Math.round(lc[0])},${Math.round(lc[1])},${Math.round(lc[2])},.6)`;
          }
          quads.push({pts:[a,b,e,f],z:(a[2]+b[2]+e[2]+f[2])/4,fill,stroke});
        }
      }
    }
    for(const Rg of R){
      const r=R0+2.5,on=(Rg.id===active||Rg.id===hover);
      for(let j=0;j<AN;j++){
        const a0=2*Math.PI*j/AN,a1=2*Math.PI*(j+1)/AN,am=(a0+a1)/2;
        const P=(x,a)=>proj(Rg.a+x,r*Math.cos(a),r*Math.sin(a),F);
        const q=[P(-CW/2,a0),P(CW/2,a0),P(CW/2,a1),P(-CW/2,a1)];
        const v=0.8+0.2*shade(Math.cos(am),0,Math.sin(am));
        const col=on?[120,160,245]:[232,219,186];
        quads.push({pts:q,z:(q[0][2]+q[1][2]+q[2][2]+q[3][2])/4+0.5,fill:`rgb(${Math.round(col[0]*v)},${Math.round(col[1]*v)},${Math.round(col[2]*v)})`,stroke:'rgba(80,70,40,.25)'});
      }
    }
    const RSx=Math.round(F.len/15),RN2=8;
    for(let j=0;j<RSx;j++){
      const x0=ROD0+F.len*j/RSx,x1=ROD0+F.len*(j+1)/RSx;
      for(let k=0;k<RN2;k++){
        const a0=2*Math.PI*k/RN2,a1=2*Math.PI*(k+1)/RN2,am=(a0+a1)/2;
        const c0=F.rr*Math.cos(a0),s0=F.rr*Math.sin(a0),c1=F.rr*Math.cos(a1),s1=F.rr*Math.sin(a1);
        const q=[proj(x0,c0,s0,F),proj(x1,c0,s0,F),proj(x1,c1,s1,F),proj(x0,c1,s1,F)];
        const v=0.72+0.28*shade(Math.cos(am),0,Math.sin(am));
        quads.push({pts:q,z:(q[0][2]+q[1][2]+q[2][2]+q[3][2])/4-16,fill:rodFill(v,(x0+x1)/2,F),stroke:'rgba(40,50,70,.3)'});
      }
    }
  }
  /* frame: ridge beam, base rails, end triangles */
  const addLine=(A,B,w,col)=>{
    const n=Math.max(1,Math.ceil(Math.hypot(B[0]-A[0],B[1]-A[1],B[2]-A[2])/60));
    for(let i=0;i<n;i++){
      const t0=i/n,t1=(i+1)/n;
      const P0=wp(A[0]+(B[0]-A[0])*t0,A[1]+(B[1]-A[1])*t0,A[2]+(B[2]-A[2])*t0),P1=wp(A[0]+(B[0]-A[0])*t1,A[1]+(B[1]-A[1])*t1,A[2]+(B[2]-A[2])*t1);
      quads.push({line:true,pts:[P0,P1],w:w*S,z:(P0[2]+P1[2])/2-20,col:col||acc});
    }
  };
  /* base plate */
  {const bx=OY,w=230,d=150,pl=[wp(-w+30,bx-2,-d),wp(w+30,bx-2,-d),wp(w+30,bx-2,d),wp(-w+30,bx-2,d)];
   quads.push({pts:pl,z:-1e5,fill:'rgb(78,84,98)',stroke:'rgba(20,24,34,.7)'});}
  /* wires from the branch feet to the trunk foot, end caps on every tube */
  ENDS.forEach((E,i)=>{
    const ex=PIPES[i].e1;
    if(i>0)addLine([E.B[0],E.B[1]-20,E.B[2]],[E.B[0],E.B[1]+20,E.B[2]],70,'#aeb6c4');
    addLine(E.T,[E.T[0]+ex[0]*30,E.T[1]+ex[1]*30,E.T[2]+ex[2]*30],14,'#aeb6c4');
    addLine([E.B[0]-ex[0]*30,E.B[1]-ex[1]*30,E.B[2]-ex[2]*30],E.B,14,'#aeb6c4');
  });
  quads.sort((u,w)=>u.z-w.z);
  const person=(x,z)=>{
    const f=wp(x,-TOP/2,z),t=wp(x,-TOP/2+TOP*0.72,z),h=f[1]-t[1];if(h<10)return;const hr=h*0.065;
    ctx.strokeStyle=acc;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();ctx.arc(f[0],t[1]+hr,hr,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(f[0]-h*0.2,f[1]);ctx.bezierCurveTo(f[0]-h*0.2,t[1]+h*0.3,f[0]-h*0.1,t[1]+h*0.16,f[0],t[1]+h*0.16);ctx.bezierCurveTo(f[0]+h*0.1,t[1]+h*0.16,f[0]+h*0.2,t[1]+h*0.3,f[0]+h*0.2,f[1]);ctx.stroke();
  };
  ctx.lineWidth=0.6;ctx.lineJoin='round';
  for(const q of quads){
    ctx.beginPath();ctx.moveTo(q.pts[0][0],q.pts[0][1]);
    for(let i=1;i<q.pts.length;i++)ctx.lineTo(q.pts[i][0],q.pts[i][1]);
    if(q.line){ctx.lineWidth=q.w;ctx.lineCap='round';ctx.strokeStyle=q.col;ctx.stroke();ctx.lineWidth=0.6}
    else{ctx.closePath();ctx.fillStyle=q.fill;ctx.fill();ctx.strokeStyle=q.stroke;ctx.stroke()}
  }
  /* flash where light jumps between touching strips */
  for(const E of ev){
    if(E.t<0.5||E.t>0.95)continue;
    if(!cTouch(E,p))continue;
    const al=fp*Math.min(1,(E.t-0.5)/0.1)*(1-Math.min(1,(E.t-0.6)/0.35));
    const pt=wp(E.M[0],E.M[1],E.M[2]),lc=LC[E.cA],rr=22*S;
    const gr=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],rr);
    gr.addColorStop(0,`rgba(255,255,255,${0.9*al})`);
    gr.addColorStop(0.35,`rgba(${Math.round(lc[0])},${Math.round(lc[1])},${Math.round(lc[2])},${0.6*al})`);
    gr.addColorStop(1,`rgba(${Math.round(lc[0])},${Math.round(lc[1])},${Math.round(lc[2])},0)`);
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(pt[0],pt[1],rr,0,7);ctx.fill();
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;tL=now/1000;
  fp+=Math.max(-dt/0.7,Math.min(dt/0.7,tfp-fp));fe+=Math.max(-dt/0.6,Math.min(dt/0.6,tfe-fe));
  if(pend&&pend.wait()){const r=pend.run;pend=null;r()}
  if(tr){
    tr.t+=dt;
    const fg=i=>tr.from[i+1]-tr.from[i],tg=i=>tr.to[i+1]-tr.to[i];
    const sm=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
    const s=Array.from({length:NG},(_,g)=>sm((tr.t-g*0.55)/0.9));
    const q=[tr.from[0]+(tr.to[0]-tr.from[0])*s[0]];
    for(let g=0;g<NG;g++)q.push(q[g]+fg(g)+(tg(g)-fg(g))*s[g]);
    p=q;
    if(tr.t>(NG-1)*0.55+0.9){p=tr.to;tr=null;if(state==='electronic')tfe=1;else tfp=1}
  }
  for(const E of ev)E.t+=dt;
  ev=ev.filter(E=>E.t<1.3);
  if(state==='photonic'&&fp>0.9&&led&&!tr&&!pend&&N%2===0&&ev.length<14&&Math.random()<dt*3){
    const q=disp(),cand=CONTACTS.filter(c=>cTouch(c,q));
    if(cand.length){
      const C=cand[Math.floor(Math.random()*cand.length)];
      ev.push({A:C.A,B:C.B,gA:C.gA,gB:C.gB,psiA:C.psiA,psiB:C.psiB,D:C.D,M:C.M,e:Math.random()<0.5?0:1,cA:(kOf(C.psiA,PIPES[C.A],C.gA)+C.A*3)%N,cB:(kOf(C.psiB,PIPES[C.B],C.gB)+C.B*3)%N,t:0});
    }
  }
  if(anim){
    tA+=dt*1.3;
    const g=Array.from({length:NG},(_,i)=>gapFor((1-Math.cos(tA-i*0.9))/2*0.9));
    const sum=g.reduce((a,b)=>a+b,0);
    p=[ROD0+30];for(let i=0;i<NG;i++)p.push(p[i]+g[i]);
  }
  if(document.activeElement!==foldEl){
    const mean=(p[NG]-p[0])/NG;foldEl.value=Math.round((L-mean)/(L-DMIN)*100);
  }
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* interaction */
let hitInfo={j:0,dir:[0,1]},drag=null;
function hit(mx,my){
  const pp=disp();let best=null,bd=1e9;
  for(const F of PIPES){
    const {R}=layoutOf(F,pp);
    for(const Rg of R){
      const c=proj(Rg.a,0,0,F),dd=Math.hypot(c[0]-mx,c[1]-my);
      if(dd<R0*S+10&&dd<bd){bd=dd;best=Rg.id;hitInfo={j:Rg.j,dir:axisDir(F,Rg.a)}}
    }
  }
  return best;
}
let mode=null,lx=0,ly=0;
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{
  const [mx,my]=pos(e);cv.setPointerCapture(e.pointerId);
  anim=false;document.getElementById('ba').classList.remove('on');
  const h=hit(mx,my);lx=mx;ly=my;
  if(h&&state==='photonic'&&!tr&&!pend&&fp>0.9){mode='collar';active=h;drag=hitInfo}else{mode='rotate';cv.style.cursor='grabbing'}
});
cv.addEventListener('pointermove',e=>{
  const [mx,my]=pos(e);
  if(mode==='collar'){
    const dir=drag.dir,dd2=dir[0]*dir[0]+dir[1]*dir[1],dv=dd2>1e-4?((mx-lx)*dir[0]+(my-ly)*dir[1])/dd2:0;
    if(Math.abs(drag.j)>0.1){const m=(p[NG]-p[0])/NG;setEqual(Math.min(L,Math.max(DMIN,m+dv/drag.j)))}
    lx=mx;ly=my;
  }else if(mode==='rotate'){
    yaw+=(mx-lx)*0.008;
    pitch=Math.max(0,Math.min(1.1,pitch+(my-ly)*0.006));lx=mx;ly=my;
  }else{
    hover=state==='photonic'?hit(mx,my):null;cv.style.cursor=hover?'pointer':'grab';
  }
});
const end=()=>{mode=null;active=-1;cv.style.cursor='grab'};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('pointerleave',()=>{hover=null});

const baEl=document.getElementById('ba');
const stopAnim=()=>{anim=false;baEl.classList.remove('on')};
foldEl.addEventListener('input',()=>{stopAnim();setEqual(gapFor(foldEl.value/100))});
document.getElementById('n').addEventListener('input',e=>{N=+e.target.value;document.getElementById('nv').textContent=N;computeMasks()});
const setFold=f=>{stopAnim();setEqual(gapFor(f))};
document.getElementById('bp').onclick=()=>setFold(0);
document.getElementById('bf').onclick=()=>setFold(1);
baEl.onclick=e=>{anim=!anim;e.target.classList.toggle('on',anim)};
document.getElementById('bl').onclick=e=>{led=!led;e.target.classList.toggle('on',led)};
document.getElementById('bb').onclick=e=>{breathe=!breathe;e.target.classList.toggle('on',breathe)};
document.getElementById('br').onclick=()=>{yaw=0.45;pitch=0.14};

function startTr(to){tr={t:0,from:p.slice(),to}}
function setState(s){
  if(s===state)return;tr=null;
  stopAnim();
  if(s==='electronic'){
    saved=p.slice();
    
    const tgtp=mkP(L);tfp=0;tfe=0;pend={wait:()=>fp<=0.001,run:()=>startTr(tgtp)};
  }else{
    const tgtp=saved||mkP(gapFor(0.55));tfe=0;tfp=0;pend={wait:()=>fe<=0.001,run:()=>startTr(tgtp)};
  }
  state=s;
  document.getElementById('bph').classList.toggle('on',s==='photonic');
  document.getElementById('bel').classList.toggle('on',s==='electronic');
  ['fold','bp','bf','ba','bl','bb'].forEach(id=>document.getElementById(id).disabled=(s==='electronic'));
}
document.getElementById('bph').onclick=()=>setState('photonic');
document.getElementById('bel').onclick=()=>setState('electronic');
</script>
